:root{--bg:#07060d;--card:rgba(24,20,40,.58);--card2:rgba(255,255,255,.055);--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);--txt:#f6f4ff;--mut:#a29fbc;--acc:#8b5cf6;--acc2:#b9a0ff;--cy:#22d3ee;--pk:#f472b6;--ok:#34d399;--warn:#fbbf24;--bad:#f87171;--r:20px;--sab:env(safe-area-inset-bottom,0px);--sat:env(safe-area-inset-top,0px);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:90px;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--txt);font:400 15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-feature-settings:"cv11","ss03";-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.nogl{background:radial-gradient(60% 50% at 20% 0%,rgba(139,92,246,.35),transparent 70%),radial-gradient(50% 45% at 90% 10%,rgba(34,211,238,.18),transparent 70%),radial-gradient(60% 50% at 60% 100%,rgba(244,114,182,.16),transparent 70%),var(--bg)}
#aur{position:fixed;inset:0;width:100%;height:100%;z-index:-2;display:block}
.veil{position:fixed;inset:0;z-index:-1;pointer-events:none;background:linear-gradient(180deg,rgba(7,6,13,.15),rgba(7,6,13,.55) 60%,rgba(7,6,13,.8))}
.veil::after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1px);background-size:3px 3px;opacity:.35;mix-blend-mode:overlay}
::selection{background:rgba(139,92,246,.45)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:99px;border:2px solid transparent;background-clip:content-box}::-webkit-scrollbar-track{background:transparent}

/* ---------- Cabeçalho ---------- */
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:18px;padding:calc(10px + var(--sat)) 20px 10px;background:rgba(10,8,20,.55);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,rgba(139,92,246,.7),rgba(34,211,238,.6),transparent);background-size:200% 100%;animation:slide 7s linear infinite;opacity:.7}
@keyframes slide{to{background-position:-200% 0}}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap}
.logo svg{width:30px;height:30px;filter:drop-shadow(0 0 10px rgba(139,92,246,.7));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-2px) rotate(8deg)}}
.logo b{font:700 20px "Inter Display",Inter,sans-serif;letter-spacing:-.03em;background:linear-gradient(100deg,#fff 20%,var(--acc2) 45%,var(--cy) 60%,#fff 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
nav#nav{position:relative;display:flex;padding:4px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav#nav::-webkit-scrollbar{display:none}
#nb{display:flex;position:relative;z-index:1}
#ind{position:absolute;left:0;top:4px;bottom:4px;width:0;border-radius:12px;background:linear-gradient(135deg,var(--acc),#6d3ff0 60%,#4f46e5);box-shadow:0 6px 24px -6px rgba(139,92,246,.8),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .45s cubic-bezier(.3,1.3,.5,1),width .45s cubic-bezier(.3,1.3,.5,1)}
#nb button{position:relative;overflow:hidden;background:none;border:0;color:var(--mut);font:600 14px Inter,sans-serif;padding:8px 14px;border-radius:12px;cursor:pointer;white-space:nowrap;transition:color .25s}
#nb button svg{display:none}#nb button:hover{color:var(--txt)}#nb button.on{color:#fff}
.bk{margin-left:auto;display:flex;gap:8px}
.bk button,.bk label{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:8px;height:38px;margin:0;padding:0 14px;background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:12px;font:600 13px Inter,sans-serif;cursor:pointer;white-space:nowrap;transition:.25s}
.bk svg{width:16px;height:16px;flex:none}.bk button:hover,.bk label:hover{border-color:rgba(139,92,246,.7);background:rgba(139,92,246,.14);box-shadow:0 0 22px -4px rgba(139,92,246,.6)}

/* ---------- Estrutura ---------- */
main{max-width:1400px;margin:0 auto;padding:28px 20px 90px}
h2{font:700 clamp(26px,4vw,36px)/1.1 "Inter Display",Inter,sans-serif;letter-spacing:-.035em;margin:2px 0 20px;background:linear-gradient(180deg,#fff,#cfc6ff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .6s both}
h3{margin:0 0 12px;font:650 17px "Inter Display",Inter,sans-serif;letter-spacing:-.02em;font-weight:700}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));margin-top:14px}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}

/* ---------- Cartões com brilho que segue o dedo/mouse ---------- */
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);box-shadow:0 10px 40px -18px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.07);animation:rise .65s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*70ms);transition:border-color .3s,transform .3s,box-shadow .3s;overflow:hidden}
.card::before,.col::before,.lcard::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:inherit;opacity:0;transition:opacity .35s;background:radial-gradient(380px circle at var(--mx,50%) var(--my,0%),rgba(139,92,246,.22),transparent 45%)}
@media(hover:hover){.card:hover,.col:hover,.lcard:hover{border-color:rgba(139,92,246,.45)}.card:hover::before,.col:hover::before,.lcard:hover::before{opacity:1}.kpi:hover{transform:translateY(-4px);box-shadow:0 22px 50px -20px rgba(139,92,246,.55),inset 0 1px 0 rgba(255,255,255,.1)}}
.kpi small{display:block;color:var(--mut);font-weight:500;font-size:13px;letter-spacing:.01em}
.kpi b{display:block;margin-top:4px;font:700 34px/1.1 "Inter Display",Inter,sans-serif;letter-spacing:-.04em;font-variant-numeric:tabular-nums;background:linear-gradient(120deg,#fff 30%,var(--acc2));-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.35),transparent 70%);animation:breathe 4s ease-in-out infinite;pointer-events:none}
.kpi:nth-child(3n+2)::after{background:radial-gradient(circle,rgba(34,211,238,.28),transparent 70%);animation-delay:-1.3s}
.kpi:nth-child(3n)::after{background:radial-gradient(circle,rgba(244,114,182,.26),transparent 70%);animation-delay:-2.6s}
@keyframes breathe{50%{transform:scale(1.45);opacity:.6}}

/* ---------- Barra de progresso ---------- */
.bar{height:12px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.4)}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--acc),var(--cy),var(--acc),var(--cy));background-size:300% 100%;animation:flow 4s linear infinite;transition:width 1s cubic-bezier(.2,.8,.2,1);box-shadow:0 0 18px rgba(139,92,246,.7);position:relative}
.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);background-size:200% 100%;animation:sweep 2.4s ease-in-out infinite}
@keyframes flow{to{background-position:-300% 0}}@keyframes sweep{from{background-position:200% 0}to{background-position:-100% 0}}

/* ---------- Botões ---------- */
button.b,.b{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;background:linear-gradient(135deg,var(--acc),#6d3ff0 60%,#5b4ff0);color:#fff;border:0;border-radius:13px;padding:10px 18px;font:600 14.5px Inter,sans-serif;cursor:pointer;box-shadow:0 8px 26px -10px rgba(139,92,246,.9),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .2s,box-shadow .3s,filter .3s;-webkit-user-select:none;user-select:none}
.b svg{width:18px;height:18px;flex:none}
.b::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);animation:glint 5.5s ease-in-out infinite;pointer-events:none}
.b.g::after,.b.r::after{display:none}
@keyframes glint{0%,70%{left:-60%}100%{left:130%}}
@media(hover:hover){.b:hover{transform:translateY(-2px);box-shadow:0 14px 34px -10px rgba(139,92,246,1),inset 0 1px 0 rgba(255,255,255,.35)}}
.b:active{transform:scale(.96)}
.b.g{background:var(--card2);border:1px solid var(--line);box-shadow:none;color:var(--txt)}
@media(hover:hover){.b.g:hover{border-color:rgba(139,92,246,.7);background:rgba(139,92,246,.14);box-shadow:0 0 24px -6px rgba(139,92,246,.7)}}
.b.r{background:rgba(248,113,113,.12);color:#fecaca;border:1px solid rgba(248,113,113,.3);box-shadow:none}
@media(hover:hover){.b.r:hover{background:rgba(248,113,113,.22);box-shadow:0 0 24px -6px rgba(248,113,113,.6)}}
.b.s{min-height:34px;padding:5px 11px;font-size:13.5px;border-radius:10px}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.35);transform:scale(0);animation:rip .65s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* ---------- Campos ---------- */
input,select,textarea{background:rgba(255,255,255,.05);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:15px Inter,sans-serif;width:100%;min-height:42px;transition:border-color .25s,box-shadow .25s,background .25s}
input:hover,select:hover,textarea:hover{border-color:var(--line2)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);background:rgba(139,92,246,.08);box-shadow:0 0 0 4px rgba(139,92,246,.2),0 0 28px -6px rgba(139,92,246,.6)}
input::placeholder,textarea::placeholder{color:#7b7896}
option{background:#14101f;color:var(--txt)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
input[type=checkbox]{accent-color:var(--acc)}
label{display:block;color:var(--mut);font-size:12.5px;font-weight:600;letter-spacing:.02em;margin:10px 0 5px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.row>*{flex:1;min-width:140px}.row>.b{flex:none}

if(F.sort)A.sort((a,b)=>{const x=a[F.sort],y=b[F.sort],n=!isNaN(parseFloat(x))&&!isNaN(parseFloat(y));return(n?x-y:String(x).localeCompare(String(y)))*F.dir});

function csv(t){const r=[];let row=[],c="",q=false;for(let i=0;i<t.length;i++){const x=t[i];if(q){if(x=='"'){if(t[i+1]=='"'){c+='"';i++}else q=false}else c+=x}else if(x=='"')q=true;else if(x==","||x==";"){row.push(c);c=""}else if(x=="\n"||x=="\r"){if(x=="\r"&&t[i+1]=="\n")i++;row.push(c);r.push(row);row=[];c=""}else c+=x}if(c||row.length){row.push(c);r.push(row)}return r.filter(r=>r.some(x=>x))}

/* ---------- navegação (topo no PC, barra inferior no celular) ---------- */
const MAINT=["dash","leads","kan","msg"];
function navDraw(){
 $("#nb").innerHTML=TABS.map(([k,n])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${IC[k]}<span>${n}</span></button>`).join("");
 const lab={dash:"Início",leads:"Leads",kan:"Funil",msg:"Mensagens"};
 $("#tabbar").innerHTML=MAINT.map(k=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${IC[k]}<span>${lab[k]}</span></button>`).join("")
  +`<button class="${MAINT.includes(tab)?"":"on"}" onclick="openMore()">${IC.more}<span>${MAINT.includes(tab)?"Mais":(TABS.find(t=>t[0]==tab)||[0,"Mais"])[1]}</span></button>`;
 requestAnimationFrame(moveInd)
}
function moveInd(){const b=$("#nb button.on"),i=$("#ind");if(!b||!i)return;i.style.width=b.offsetWidth+"px";i.style.transform=`translateX(${b.offsetLeft}px)`;b.scrollIntoView&&b.scrollIntoView({inline:"center",block:"nearest"})}
addEventListener("resize",()=>requestAnimationFrame(moveInd));
function openMore(){const m=$("#modal");
 m.innerHTML=`<div class="card"><i class="grab"></i><h3>Mais opções</h3><div class="mlist">${["maps","aud","pk","cfg"].map(k=>`<button class="mi ${k==tab?"on":""}" onclick="closeM();go('${k}')">${IC[k]}<span>${TABS.find(t=>t[0]==k)[1]}</span></button>`).join("")}</div>
 <h3 style="margin-top:18px">Backup dos dados</h3><div class="row"><button class="b g" onclick="expJ();closeM()">${IC.dl} Baixar backup</button><label class="b g" style="margin:0">${IC.ul} Restaurar<input type="file" accept=".json,.csv" hidden onchange="closeM();imp(this.files[0]);this.value=''"></label></div></div>`;
 m.classList.add("on");m.onkeydown=null}

/* ---------- efeitos pós-render ---------- */
let FRESH=true;
function countUp(el){const t=el.textContent,m=t.match(/\d[\d.]*/);if(!m)return;const to=parseInt(m[0].replace(/\./g,""),10);if(!to||matchMedia("(prefers-reduced-motion:reduce)").matches)return;
 const pre=t.slice(0,m.index),suf=t.slice(m.index+m[0].length),t0=performance.now(),D=1000;
 const step=n=>{const p=Math.min(1,(n-t0)/D),e=1-Math.pow(1-p,4);el.textContent=pre+Math.round(to*e).toLocaleString("pt-BR")+suf;if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)}
function fx(){
 document.body.dataset.tab=tab;
 document.querySelectorAll("#app .card,#app .col").forEach((e,i)=>e.style.setProperty("--i",Math.min(i,12)));
 document.querySelectorAll("#app .kc,#app .fu").forEach((e,i)=>e.style.animationDelay=Math.min(i,14)*45+300+"ms");
 document.querySelectorAll("#app .kpi b").forEach(countUp);
 document.querySelectorAll("#app .bar i").forEach(i=>{const w=i.style.width;i.style.width="0";requestAnimationFrame(()=>requestAnimationFrame(()=>i.style.width=w))});
}
document.addEventListener("pointermove",e=>{const c=e.target.closest&&e.target.closest(".card,.col,.lcard");if(c){const r=c.getBoundingClientRect();c.style.setProperty("--mx",e.clientX-r.left+"px");c.style.setProperty("--my",e.clientY-r.top+"px")}},{passive:true});
document.addEventListener("pointerdown",e=>{const b=e.target.closest&&e.target.closest(".b,#nb button,#tabbar button,#fab,.chip,.mi,.bk button,.bk label");if(!b)return;
 const r=b.getBoundingClientRect(),s=document.createElement("span"),d=Math.max(r.width,r.height)*2;s.className="rip";
 s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;
 if(getComputedStyle(b).position=="static")b.style.position="relative";b.appendChild(s);setTimeout(()=>s.remove(),650)});
$("#modal").addEventListener("click",e=>{if(e.target.id=="modal")closeM()});

/* ---------- leads em cartões (celular) + folha de edição ---------- */
function fltLeads(){const q=F.q.toLowerCase();let A=S.leads.filter(l=>(!q||JSON.stringify(Object.values(l)).toLowerCase().includes(q))&&(!F.niche||l.niche==F.niche)&&(!F.area||l.area==F.area)&&(!F.status||l.status==F.status)&&(!F.prio||l.prio==F.prio));
 if(F.sort)A.sort((a,b)=>{const x=a[F.sort],y=b[F.sort],n=!isNaN(parseFloat(x))&&!isNaN(parseFloat(y));return(n?x-y:String(x).localeCompare(String(y)))*F.dir});return A}
function lcard(l,i,fresh){
 const dias=l.last?dd(today(),l.last):0,tel=(l.phone||"").replace(/[^\d+]/g,""),ig=String(l.ig||"").replace("@","").trim();
 const tags=[l.niche&&`<span class="tag">${esc(l.niche)}</span>`,l.area&&`<span class="tag">${IC.maps.replace("<svg",'<svg width="13" height="13"')}${esc(l.area)}</span>`,l.grating&&`<span class="tag">★ ${esc(l.grating)}</span>`,l.followers&&`<span class="tag">${IC.users.replace("<svg",'<svg width="13" height="13"')}${(+l.followers).toLocaleString("pt-BR")}</span>`,l.value&&`<span class="tag">${money(l.value)}</span>`,l.next&&`<span class="tag">Follow-up ${esc(l.next.split("-").reverse().slice(0,2).join("/"))}</span>`,stale(l)&&`<span class="tag w">sem contato há ${dias} dias</span>`].filter(Boolean).join("");
 const w=["Novo","Analisado"].includes(l.status)?0:1;
 return `<div class="lcard ${fresh?"in":""} ${stale(l)?"stale":""}" style="--i:${Math.min(i,10)}"><div class="lc-top"><div><b>${esc(l.name)||"Sem nome"}</b></div><span class="pill p-${l.prio}">${esc(l.prio)}</span></div>
 <div class="lc-meta">${tags}</div>
 <select class="st s${ST.indexOf(l.status)}" data-id="${l.id}" data-k="status">${opt(ST,l.status)}</select>
 <div class="lc-act"><button class="b wa" onclick="sendWA('${l.id}',${w})">${IC.wa}WhatsApp</button>
 ${ig?`<a class="b g" href="https://instagram.com/${esc(ig)}" target="_blank" rel="noopener" style="text-decoration:none">${IC.ig}Instagram</a>`:`<button class="b g" onclick="toast('Lead sem Instagram')">${IC.ig}Instagram</button>`}
 ${tel?`<a class="b g" href="tel:${esc(tel)}" style="text-decoration:none">${IC.tel}Ligar</a>`:`<button class="b g" onclick="toast('Lead sem telefone')">${IC.tel}Ligar</button>`}
 <button class="b g" onclick="openEdit('${l.id}')">${IC.edit}Editar</button></div></div>`}
function drawCards(){const lc=$("#lc");if(!lc)return;const A=fltLeads(),f=FRESH;FRESH=false;
 lc.innerHTML=`<p class="cnt">${A.length} lead${A.length==1?"":"s"}</p>`+(A.length?A.map((l,i)=>lcard(l,i,f)).join(""):`<div class="empty">${IC.users}<br><b>Nenhum lead por aqui</b><br><span>Ajuste os filtros ou adicione um novo lead.</span></div>`)}
function openEdit(id){const l=L(id);if(!l)return;const m=$("#modal"),wide=["problems","notes","addr","maps"];
 m.innerHTML=`<div class="card"><i class="grab"></i><div class="eh"><h3 style="margin:0">${esc(l.name)||"Editar lead"}</h3><button class="b g s" onclick="closeM()">Fechar</button></div><div class="eg">${COLS.map(c=>`<div class="${wide.includes(c[0])?"wide":""}"><label>${c[1]}</label>${cell(l,c).replace(/^<td>|<\/td>$/g,"")}</div>`).join("")}</div>
 <div class="row" style="margin-top:18px"><button class="b" onclick="closeM()">Pronto</button><button class="b r" onclick="closeM();del('${l.id}')">Excluir lead</button></div></div>`;
 m.classList.add("on");m.onkeydown=null}

/* ---------- fundo aurora (shader WebGL) ---------- */
(function(){const c=document.getElementById("aur");if(!c)return;let gl=null;try{gl=c.getContext("webgl",{alpha:false,antialias:false,powerPreference:"low-power"})}catch(e){}
 const bail=()=>{c.remove();document.body.classList.add("nogl")};if(!gl)return bail();
 const vs="attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}";
 const fs=`#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 r;uniform float t;
float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<4;i++){v+=a*n(p);p=p*2.03+vec2(1.7,9.2);a*=.5;}return v;}
void main(){
 vec2 uv=gl_FragCoord.xy/r;float asp=r.x/r.y;vec2 p=vec2(uv.x*asp,uv.y);float T=t*.07;
 vec3 col=vec3(.026,.022,.05);
 for(int i=0;i<3;i++){
  float fi=float(i);
  float wv=fbm(vec2(p.x*(.85+.3*fi)+T*(1.+fi*.45)+fi*7.3,T*.55+fi*3.1));
  float c0=.72-fi*.13+(wv-.5)*.62+.04*sin(p.x*2.+T*4.+fi);
  float d=uv.y-c0;
  float cur=exp(-d*d*(16.+fi*7.))*(.3+.7*fbm(vec2(p.x*3.4+T*2.5,uv.y*2.5-T*1.3+fi)));
  float rays=smoothstep(.0,.6,d+.25)*exp(-max(d,0.)*5.)*.0;
  vec3 tint=mix(mix(vec3(.55,.24,.98),vec3(.1,.82,.9),step(.5,fi)),vec3(.96,.3,.7),step(1.5,fi));
  col+=tint*(cur*(.62-fi*.1)+rays);
 }
 col+=vec3(.36,.18,.7)*.18*smoothstep(.5,0.,uv.y)*(.6+.4*fbm(p*2.+T));
 col*=1.-.4*length(uv-.5);
 gl_FragColor=vec4(col,1.);}`;
 function sh(ty,src){const o=gl.createShader(ty);gl.shaderSource(o,src);gl.compileShader(o);return o}
 const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,vs));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);
 if(!gl.getProgramParameter(pr,gl.LINK_STATUS))return bail();
 gl.useProgram(pr);const bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,3,-1,-1,3]),gl.STATIC_DRAW);
 const lo=gl.getAttribLocation(pr,"p");gl.enableVertexAttribArray(lo);gl.vertexAttribPointer(lo,2,gl.FLOAT,false,0,0);
 const ur=gl.getUniformLocation(pr,"r"),ut=gl.getUniformLocation(pr,"t");
 function size(){const s=innerWidth<820?.38:.5;c.width=Math.max(2,innerWidth*s|0);c.height=Math.max(2,innerHeight*s|0);gl.viewport(0,0,c.width,c.height)}
 size();addEventListener("resize",()=>{size();draw(performance.now())});
 const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;let last=0;
 function draw(ms){gl.uniform2f(ur,c.width,c.height);gl.uniform1f(ut,ms/1000+30);gl.drawArrays(gl.TRIANGLES,0,3)}
 function loop(ms){requestAnimationFrame(loop);if(document.hidden||ms-last<34)return;last=ms;draw(ms)}
 if(rm)draw(5000);else requestAnimationFrame(loop);
})();

render();
</script>
